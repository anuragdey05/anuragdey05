<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Anurag Dey — a personal recording</title>
  <desc id="desc">A cream and faded red cassette with Anurag Dey on its paper label, two visible tape reels, and Side A selected. Quiet, handmade physical-media styling.</desc>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 6 6 0" stroke="#35332e" stroke-width="1"/>
    </pattern>
    <g id="reel">
      <circle r="49" fill="#d9d2bf"/>
      <circle r="32" fill="#f1ead9"/>

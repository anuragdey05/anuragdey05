        <path d="M-7-33h14v17H-7z"/>
        <path d="M-7-33h14v17H-7z" transform="rotate(60)"/>
        <path d="M-7-33h14v17H-7z" transform="rotate(120)"/>
        <path d="M-7-33h14v17H-7z" transform="rotate(180)"/>
        <path d="M-7-33h14v17H-7z" transform="rotate(240)"/>
        <path d="M-7-33h14v17H-7z" transform="rotate(300)"/>
      </g>
      <circle r="12" fill="#36342f"/>
    </g>
    <g id="screw">
      <circle r="7" fill="#c1bba9" stroke="#696659" stroke-width="1.5"/>
      <path d="m-3 3 6-6" stroke="#696659" stroke-width="1.5"/>
    </g>
  </defs>
  <rect width="1200" height="600" rx="4" fill="#eee7d6"/>
